[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-paper"
version = "0.1.0"
description = "Reusable agent research and public-order-book paper execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pm-paper = "pm_paper.cli:main"

[tool.setuptools.packages.find]
include = ["pm_paper*"]

[tool.setuptools.package-data]
pm_paper = ["prompts/*.md", "default_config.json"]
